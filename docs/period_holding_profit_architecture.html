<svg viewBox="0 0 880 520" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans CJK SC','WenQuanYi Micro Hei',sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="880" height="520" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="440" y="32" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="bold">各週期持有收益獨立固化架構</text>
  <text x="440" y="52" text-anchor="middle" fill="#94a3b8" font-size="12">period_holding_profit 表 · DB v14</text>

  <!-- Four cycle cards -->
  <g transform="translate(20, 70)">
    <!-- UltraShort -->
    <rect x="0" y="0" width="190" height="80" rx="8" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="95" y="24" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="bold">超短線 UltraShortQuant</text>
    <text x="95" y="44" text-anchor="middle" fill="#cbd5e1" font-size="11">getQuantType() = "UltraShortQuant"</text>
    <text x="95" y="62" text-anchor="middle" fill="#94a3b8" font-size="10">renderPositions() → 固化收益</text>
    <text x="95" y="76" text-anchor="middle" fill="#64748b" font-size="9">持倉數 / 成本 / 市值 / 盈虧</text>
  </g>

  <g transform="translate(230, 70)">
    <!-- ShortTerm -->
    <rect x="0" y="0" width="190" height="80" rx="8" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="95" y="24" text-anchor="middle" fill="#3b82f6" font-size="13" font-weight="bold">短線 ShortTermQuant</text>
    <text x="95" y="44" text-anchor="middle" fill="#cbd5e1" font-size="11">getQuantType() = "ShortTermQuant"</text>
    <text x="95" y="62" text-anchor="middle" fill="#94a3b8" font-size="10">renderPositions() → 固化收益</text>
    <text x="95" y="76" text-anchor="middle" fill="#64748b" font-size="9">持倉數 / 成本 / 市值 / 盈虧</text>
  </g>

  <g transform="translate(440, 70)">
    <!-- MidTerm -->
    <rect x="0" y="0" width="190" height="80" rx="8" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="95" y="24" text-anchor="middle" fill="#8b5cf6" font-size="13" font-weight="bold">中線 MidTermQuant</text>
    <text x="95" y="44" text-anchor="middle" fill="#cbd5e1" font-size="11">getQuantType() = "MidTermQuant"</text>
    <text x="95" y="62" text-anchor="middle" fill="#94a3b8" font-size="10">renderPositions() → 固化收益</text>
    <text x="95" y="76" text-anchor="middle" fill="#64748b" font-size="9">持倉數 / 成本 / 市值 / 盈虧</text>
  </g>

  <g transform="translate(650, 70)">
    <!-- LongTerm -->
    <rect x="0" y="0" width="190" height="80" rx="8" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5"/>
    <text x="95" y="24" text-anchor="middle" fill="#10b981" font-size="13" font-weight="bold">長線 LongTermQuant</text>
    <text x="95" y="44" text-anchor="middle" fill="#cbd5e1" font-size="11">getQuantType() = "LongTermQuant"</text>
    <text x="95" y="62" text-anchor="middle" fill="#94a3b8" font-size="10">renderPositions() → 固化收益</text>
    <text x="95" y="76" text-anchor="middle" fill="#64748b" font-size="9">持倉數 / 成本 / 市值 / 盈虧</text>
  </g>

  <!-- Arrows down -->
  <g stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="115" y1="155" x2="115" y2="185"/>
    <line x1="325" y1="155" x2="325" y2="185"/>
    <line x1="535" y1="155" x2="535" y2="185"/>
    <line x1="745" y1="155" x2="745" y2="185"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#475569"/>
    </marker>
  </defs>

  <!-- QuantFragmentBase -->
  <g transform="translate(140, 190)">
    <rect x="0" y="0" width="600" height="70" rx="8" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="2" filter="url(#glow)"/>
    <text x="300" y="26" text-anchor="middle" fill="#6366f1" font-size="14" font-weight="bold">QuantFragmentBase.renderPositions()</text>
    <text x="300" y="46" text-anchor="middle" fill="#cbd5e1" font-size="11">計算 totalCost / totalValue / totalPnl / totalPnlPct</text>
    <text x="300" y="62" text-anchor="middle" fill="#94a3b8" font-size="10">lifecycleScope.launch(IO) → PeriodHoldingProfitEntity → dao.insert()</text>
  </g>

  <!-- Arrow down to DB -->
  <line x1="440" y1="265" x2="440" y2="300" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Database table -->
  <g transform="translate(160, 305)">
    <rect x="0" y="0" width="560" height="120" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="280" y="24" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="bold">📊 period_holding_profit (DB v14)</text>
    <line x1="10" y1="32" x2="550" y2="32" stroke="#334155" stroke-width="1"/>

    <!-- Columns -->
    <g font-size="10" fill="#94a3b8">
      <text x="20" y="48">id</text>
      <text x="60" y="48" fill="#f59e0b">period_type</text>
      <text x="170" y="48" fill="#3b82f6">trade_date</text>
      <text x="260" y="48">holding_count</text>
      <text x="360" y="48">total_cost</text>
      <text x="440" y="48">total_value</text>
    </g>
    <g font-size="10" fill="#94a3b8">
      <text x="20" y="66">total_pnl</text>
      <text x="100" y="66">total_pnl_pct</text>
      <text x="210" y="66">stock_codes</text>
      <text x="320" y="66">created_at</text>
    </g>
    <line x1="10" y1="76" x2="550" y2="76" stroke="#334155" stroke-width="1"/>

    <!-- Sample rows -->
    <g font-size="9" fill="#64748b" font-family="monospace">
      <text x="20" y="92">1  UltraShortQuant  2026-07-31  3  15000  16200  +1200  +8.00%</text>
      <text x="20" y="106">2  ShortTermQuant   2026-07-31  5  28000  27500  -500   -1.79%</text>
    </g>
  </g>

  <!-- Arrow to display -->
  <line x1="440" y1="425" x2="440" y2="450" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Display -->
  <g transform="translate(140, 455)">
    <rect x="0" y="0" width="600" height="50" rx="8" fill="url(#cardGrad)" stroke="#22c55e" stroke-width="1.5"/>
    <text x="300" y="22" text-anchor="middle" fill="#22c55e" font-size="12" font-weight="bold">💰 持有收益歷史 (數據菜單)</text>
    <text x="300" y="40" text-anchor="middle" fill="#94a3b8" font-size="10">showHoldingProfitHistory() → 各週期最新收益 + 日變化 + 歷史走勢</text>
  </g>
</svg>
