// ── K 線渲染器 ──
function renderCandles(data, w, h) {
  const padL=30,padR=10,padT=15,padB=25;
  const cw=w-padL-padR, ch=h-padT-padB;
  const n=data.length;
  const slot=cw/n;
  const bw=slot*0.6;
  const allH=data.flatMap(d=>[d.h,d.l]);
  const min=Math.min(...allH), max=Math.max(...allH);
  const range=max-min || 1;
  const y=v=>padT+ch-(v-min)/range*ch;
  const x=i=>padL+i*slot+slot/2;

  let svg=`<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">`;
  // grid
  for(let i=0;i<=4;i++){
    const gy=padT+ch*i/4;
    const val=max-range*i/4;
    svg+=`<line x1="${padL}" y1="${gy}" x2="${w-padR}" y2="${gy}" stroke="#eee" stroke-width="1"/>`;
    svg+=`<text x="${padL-4}" y="${gy+3}" text-anchor="end" font-size="9" fill="#999">${val.toFixed(1)}</text>`;
  }
  // labels
  data.forEach((d,i)=>{
    if(i%2===0||i===n-1){
      const lx=x(i);
      svg+=`<text x="${lx}" y="${h-6}" text-anchor="middle" font-size="9" fill="#999">${d.label||''}</text>`;
    }
  });
  // candles
  data.forEach((d,i)=>{
    const cx=x(i);
    const isUp=d.c>=d.o;
    const color=isUp?'#E53935':'#43A047';
    const bodyTop=y(Math.max(d.o,d.c));
    const bodyBot=y(Math.min(d.o,d.c));
    const bodyH=Math.max(bodyBot-bodyTop,1);
    // wick
    svg+=`<line x1="${cx}" y1="${y(d.h)}" x2="${cx}" y2="${y(d.l)}" stroke="${color}" stroke-width="1.2"/>`;
    // body
    svg+=`<rect x="${cx-bw/2}" y="${bodyTop}" width="${bw}" height="${bodyH}" fill="${color}" rx="1"/>`;
    // arrow for key candle
    if(d.arrow){
      const ay=d.arrow==='up'?y(d.h)-12:y(d.l)+12;
      const atext=d.arrow==='up'?'▲':'▼';
      svg+=`<text x="${cx}" y="${ay}" text-anchor="middle" font-size="10" fill="${color}" font-weight="bold">${atext}</text>`;
    }
  });
  // annotations
  if(data.annotations){
    data.annotations.forEach(a=>{
      svg+=`<line x1="${padL}" y1="${y(a.price)}" x2="${w-padR}" y2="${y(a.price)}" stroke="${a.color||'#999'}" stroke-width="1" stroke-dasharray="4,3"/>`;
      svg+=`<text x="${w-padR-4}" y="${y(a.price)-4}" text-anchor="end" font-size="9" fill="${a.color||'#999'}">${a.label}</text>`;
    });
  }
  svg+='</svg>';
  return svg;
}

// ── 渲染 ──
function renderGrid(filter='all'){
  const grid=document.getElementById('grid');
  const cats={
    single:'單根 K 線形態',
    two:'雙 K 線形態',
    three:'三 K 線形態',
    five:'多 K 線形態',
    trend:'趨勢形態'
  };
  let html='';
  const filtered=filter==='all'?patterns:patterns.filter(p=>p.cat===filter);
  const grouped={};
  filtered.forEach(p=>{if(!grouped[p.cat])grouped[p.cat]=[];grouped[p.cat].push(p)});

  for(const cat of ['single','two','three','five','trend']){
    if(!grouped[cat])continue;
    html+=`<div style="grid-column:1/-1"><h2 class="section-title">${cats[cat]}</h2></div>`;
    grouped[cat].forEach(p=>{
      const badgeClass=p.type==='bull'?'bull':p.type==='bear'?'bear':'neutral';
      const badgeText=p.type==='bull'?'看漲':p.type==='bear'?'看跌':'中性';
      const svgW=Math.min(340,360);
      const svgH=p.data.length>4?180:150;
      html+=`<div class="card" data-cat="${p.cat}">
        <div class="card-header">
          <span class="card-title">${p.name}<span class="en">${p.en}</span></span>
          <span class="badge ${badgeClass}">${badgeText}</span>
        </div>
        <div class="card-body">
          <div class="card-svg">${renderCandles(p.data,svgW,svgH)}</div>
          <div class="card-desc">${p.desc}</div>
          <div class="card-rules">${p.rules}</div>
        </div>
      </div>`;
    });
  }
  grid.innerHTML=html;
}

function filterPattern(cat){
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  renderGrid(cat);
}

renderGrid('all');
</script>
