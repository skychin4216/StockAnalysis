name: Android Automated Test

# 云端模拟器全自动测试：构建 APK -> 启动模拟器 -> 安装 APK -> 跑仪器化测试
# 触发方式（任选其一）：
#   1. push 到 dev/main
#   2. 定时（每周一/四 10:00 北京时间 = 02:00 UTC）
#   3. 手动：GitHub Repo -> Actions -> Android Automated Test -> Run workflow
on:
  push:
    branches: [dev, main]
  schedule:
    - cron: '0 2 * * 1,4'
  workflow_dispatch:

concurrency:
  group: android-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts') }}

      - name: Grant execute permission
        run: chmod +x gradlew

      # 1) 构建 APK（debug 含测试包 + release 正式包）
      - name: Build APK
        run: ./gradlew assembleDebug assembleDebugAndroidTest assembleRelease --stacktrace

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore

      # 2) 启用 KVM（云端硬件加速，模拟器可正常启动）
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm || echo "/dev/kvm NOT available"

      # 3) 安装 API 34 google_apis 系统镜像（手动分步，便于诊断）
      - name: Install system image
        run: |
          set -x
          echo "sdk root: $ANDROID_HOME"
          sdkmanager --version || sdkmanager --version
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "system-images;android-34;google_apis;x86_64" 2>&1 | tee /tmp/sdk-install.log
          echo "EXIT=$?"
          ls -la "$ANDROID_HOME/system-images/android-34/google_apis/x86_64/" | head -20

      # 4) 创建 AVD
      - name: Create AVD
        run: |
          set -x
          echo "no" | avdmanager create avd -n ci_test -k "system-images;android-34;google_apis;x86_64" -d pixel_6 --force 2>&1 | tee /tmp/avd-create.log
          avdmanager list avd | head -20

      # 5) 启动模拟器（后台）并等待 boot 完成
      - name: Start emulator
        run: |
          set -x
          $ANDROID_HOME/emulator/emulator -avd ci_test \
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim \
            -no-metrics -memory 2048 -cores 2 \
            > /tmp/emulator.log 2>&1 &
          EMU_PID=$!
          echo "emulator pid=$EMU_PID"
          # 等待 adb 识别设备
          adb wait-for-device || true
          # 轮询 boot 完成（最多 10 分钟）
          for i in $(seq 1 60); do
            sleep 10
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            DEV=$(adb devices | grep emulator || true)
            echo "[$i] boot=$BOOT device=$DEV"
            if [ "$BOOT" = "1" ]; then echo "BOOT OK"; break; fi
            # 模拟器进程是否还活着
            if ! kill -0 $EMU_PID 2>/dev/null; then
              echo "EMULATOR PROCESS DIED at iteration $i"
              tail -100 /tmp/emulator.log
              break
            fi
          done
          adb devices
          adb shell getprop ro.build.version.release 2>/dev/null || true

      # 6) 上传模拟器启动诊断（无论成败）
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-diagnostics
          path: |
            /tmp/emulator.log
            /tmp/sdk-install.log
            /tmp/avd-create.log
          if-no-files-found: ignore

      # 7) 跑仪器化测试（离线安全用例）
      #    注：StockAnalysisTest 依赖真实 API key，未注入密钥时跳过，避免 CI 挂红。
      - name: Run instrumented tests
        run: |
          BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
          if [ "$BOOT" != "1" ]; then
            echo "===== EMULATOR NOT BOOTED, cannot run tests ====="
            adb devices
            tail -200 /tmp/emulator.log
            exit 1
          fi
          echo "===== adb devices ====="
          adb devices
          adb shell getprop ro.build.version.release || true
          ./gradlew connectedDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=com.chin.stockanalysis.backtest.StrategyBacktestTest,com.chin.stockanalysis.V6FeatureTest,com.chin.stockanalysis.ExampleInstrumentedTest \
            > app/build/gradle-test-output.log 2>&1 \
            || { echo "===== gradle FAILED, dump tail ====="; tail -200 app/build/gradle-test-output.log; adb logcat -d -t 300 > app/build/logcat.txt 2>/dev/null || true; exit 1; }
          echo "===== gradle OK ====="
          tail -50 app/build/gradle-test-output.log

      # 8) 上传测试报告与诊断日志（无论成败均可查看）
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/gradle-test-output.log
            app/build/logcat.txt
          if-no-files-found: ignore

      - name: List APK sizes
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk 2>/dev/null || true
          ls -lh app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk 2>/dev/null || true
