name: Android Automated Test

# 云端模拟器全自动测试：构建 APK -> 启动模拟器 -> 安装 APK -> 跑仪器化测试
# 触发方式（任选其一）：
#   1. push 到 dev/main
#   2. 定时（每周一/四 10:00 北京时间 = 02:00 UTC）
#   3. 手动：GitHub Repo -> Actions -> Android Automated Test -> Run workflow
#
# 为什么用 macos-14 (Intel)：
#   - GitHub 托管 Linux runner 的 KVM 硬件加速仅对公共仓库开放；私有仓库无 /dev/kvm，
#     x86_64 系统镜像拒绝启动（Failed to open the device 'kvm'）。
#   - macos-latest 已是 Apple Silicon (arm64)，跑 x86_64 镜像只能软件模拟，boot 超时。
#   - macos-14 是 Intel x64，使用系统内置 Hypervisor.framework 硬件加速，无需 KVM，
#     私有仓库可直接运行 x86_64 模拟器。
on:
  push:
    branches: [dev, main]
  schedule:
    - cron: '0 2 * * 1,4'
  workflow_dispatch:

concurrency:
  group: android-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts') }}

      - name: Grant execute permission
        run: chmod +x gradlew

      # 1) 构建 APK（debug 含测试包 + release 正式包）
      - name: Build APK
        run: ./gradlew assembleDebug assembleDebugAndroidTest assembleRelease --stacktrace

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore

      # 2) 云端启动模拟器并跑仪器化测试（离线安全用例）
      #    注：StockAnalysisTest 依赖真实 API key，未注入密钥时跳过，避免 CI 挂红。
      #    macOS 上 Hypervisor.framework 提供硬件加速，无需任何 KVM 启用步骤。
      #    测试输出写文件并随 artifact 上传，便于失败后诊断。
      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 2048M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            echo "===== adb devices ====="
            adb devices
            adb shell getprop ro.build.version.release || true
            ./gradlew connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.chin.stockanalysis.backtest.StrategyBacktestTest,com.chin.stockanalysis.V6FeatureTest,com.chin.stockanalysis.ExampleInstrumentedTest \
              > app/build/gradle-test-output.log 2>&1 \
              || { echo "===== gradle FAILED, dump tail ====="; tail -200 app/build/gradle-test-output.log; adb logcat -d -t 300 > app/build/logcat.txt 2>/dev/null || true; exit 1; }
            echo "===== gradle OK ====="
            tail -50 app/build/gradle-test-output.log

      # 3) 上传测试报告与诊断日志（无论成败均可查看）
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/gradle-test-output.log
            app/build/logcat.txt
          if-no-files-found: ignore

      - name: List APK sizes
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/release/app-release.apk
