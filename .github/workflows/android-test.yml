name: Android Automated Test

# 云端模拟器全自动测试：构建 APK -> 启动模拟器 -> 安装 APK -> 跑仪器化测试
# 触发方式（任选其一）：
#   1. push 到 dev/main
#   2. 定时（每周一/四 10:00 北京时间 = 02:00 UTC）
#   3. 手动：GitHub Repo -> Actions -> Android Automated Test -> Run workflow
on:
  push:
    branches: [dev, main]
  schedule:
    - cron: '0 2 * * 1,4'
  workflow_dispatch:

concurrency:
  group: android-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts') }}

      - name: Grant execute permission
        run: chmod +x gradlew

      # 1) 构建 APK（debug 含测试包 + release 正式包）
      - name: Build APK
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk

      # 2) 启用 KVM（云端硬件加速，模拟器可正常启动）
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 3) 云端启动模拟器并跑仪器化测试（离线安全用例）
      #    注：StockAnalysisTest 依赖真实 API key，未注入密钥时跳过，避免 CI 挂红。
      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            ./gradlew connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.chin.stockanalysis.backtest.StrategyBacktestTest,com.chin.stockanalysis.V6FeatureTest,com.chin.stockanalysis.ExampleInstrumentedTest

      # 4) 上传测试报告（无论成败均可查看）
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/

      - name: List APK sizes
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/release/app-release.apk
